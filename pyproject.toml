[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "electrical-engineering-mcp"
version = "0.1.0"
description = "Deterministic electrical calculation MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
electrical-engineering-mcp = "electrical_engineering_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/electrical_engineering_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
